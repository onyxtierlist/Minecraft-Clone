[package]
name = "rustcraft"
version = "0.1.0"
edition = "2021"
description = "A Minecraft-like voxel engine in Rust using wgpu (Vulkan/Metal)."

[dependencies]
wgpu = "25"
winit = "0.30"
glam = { version = "0.29", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
